name: Build DAZ Studio Plugin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.1

    - name: Compile C++ Source Files
      shell: cmd
      run: |
        cl.exe /c /EHsc plugin.cpp CustomShelfPane.cpp
        link.exe /DLL /OUT:CustomShelfPlugin.dll plugin.obj CustomShelfPane.obj

    - name: Upload DLL Artifact
      uses: actions/upload-artifact@v3
      with:
        name: CustomShelfPlugin-DLL
        path: CustomShelfPlugin.dll
